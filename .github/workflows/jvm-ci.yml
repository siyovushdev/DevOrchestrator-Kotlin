name: JVM checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.0'
      - name: Build and unit tests
        run: gradle --no-daemon clean test build installDist
      - name: Running-server smoke test
        shell: bash
        run: |
          set -euo pipefail
          DEVORCH_PORT=18080 ./build/install/dev-orchestrator-kotlin/bin/dev-orchestrator-kotlin > /tmp/devorch-bootstrap.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if [[ "$(curl --silent --fail --max-time 2 http://127.0.0.1:18080/health || true)" == "OK" ]]; then
              echo "HTTP /health: PASS"
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          echo "HTTP /health: FAIL" >&2
          cat /tmp/devorch-bootstrap.log >&2
          exit 1
