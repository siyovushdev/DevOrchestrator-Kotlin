name: JVM checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.0'
      - name: Build and unit tests
        run: gradle --no-daemon clean test build installDist
      - name: Running-server smoke test
        shell: bash
        run: |
          set -euo pipefail
          DEVORCH_PORT=18080 ./build/install/dev-orchestrator-kotlin/bin/dev-orchestrator-kotlin > /tmp/devorch-bootstrap.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if [[ "$(curl --silent --fail --max-time 2 http://127.0.0.1:18080/health || true)" == "OK" ]]; then
              echo "HTTP /health: PASS"
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          echo "HTTP /health: FAIL" >&2
          cat /tmp/devorch-bootstrap.log >&2
          exit 1

  github-live-read:
    # Only owner's same-repo PRs: never grant a GitHub token to fork PR code.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'siyovushdev' && github.repository == 'siyovushdev/DevOrchestrator-Kotlin' }}
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.0'
      - name: Real Kotlin GitHub GET + temporary SQLite pin/restart
        env:
          DEVORCH_GITHUB_LIVE_READ: 'true'
          DEVORCH_GITHUB_LIVE_REPO: ${{ github.repository }}
          DEVORCH_GITHUB_LIVE_REPO_ID: ${{ github.repository_id }}
          DEVORCH_GITHUB_LIVE_ISSUE: '18'
          DEVORCH_GITHUB_READ_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon test --tests dev.orchestrator.github.GitHubLiveReadSmokeTest
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          result = Path("build/test-results/test/TEST-dev.orchestrator.github.GitHubLiveReadSmokeTest.xml")
          assert result.is_file(), "Live integration test was not executed"
          suite = ElementTree.parse(result).getroot()
          counts = {key: int(suite.attrib.get(key, 0)) for key in ("tests", "skipped", "failures", "errors")}
          assert counts == {"tests": 1, "skipped": 0, "failures": 0, "errors": 0}, counts
          print("LIVE_GITHUB_READ_EXECUTED_AND_PASSED")
          PY
